# /etc/tmpfiles.d/99-legion-power.conf
# Grant non-root write access to ACPI platform_profile and Lenovo Legion fan controls
z /sys/firmware/acpi/platform_profile 0666 root root -
z /sys/class/platform-profile/platform-profile*/profile 0666 root root -
z /sys/class/hwmon/hwmon*/fan*_target 0666 root root -
